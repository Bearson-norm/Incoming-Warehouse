name: Deploy cloud server

on:
  push:
    branches: [main]
    paths:
      - "Software/Dashboard/api/**"
      - "Software/Dashboard/web/**"
      - "Software/infra/**"
      - ".github/workflows/deploy-cloud.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  validate:
    name: Validate compose
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Software/infra
    steps:
      - uses: actions/checkout@v4
      - name: Check docker compose file
        run: docker compose -f docker-compose.yml config --quiet

  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    environment: cloud
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    env:
      DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/incoming-warehouse' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync cloud files
        env:
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          set -euo pipefail
          REMOTE="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          SSH=(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes)
          RSYNC=(rsync -az --delete --exclude node_modules --exclude dist --exclude .env -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes")

          "${SSH[@]}" "$REMOTE" "mkdir -p '${DEPLOY_PATH}/Software/Dashboard/api' '${DEPLOY_PATH}/Software/Dashboard/web' '${DEPLOY_PATH}/Software/infra/scripts' '${DEPLOY_PATH}/Software/infra/nginx'"

          "${RSYNC[@]}" Software/Dashboard/api/ "$REMOTE:${DEPLOY_PATH}/Software/Dashboard/api/"
          "${RSYNC[@]}" Software/Dashboard/web/ "$REMOTE:${DEPLOY_PATH}/Software/Dashboard/web/"
          "${RSYNC[@]}" Software/infra/ "$REMOTE:${DEPLOY_PATH}/Software/infra/"

      - name: Start cloud stack
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            chmod +x "${{ env.DEPLOY_PATH }}/Software/infra/scripts/deploy-cloud.sh"
            "${{ env.DEPLOY_PATH }}/Software/infra/scripts/deploy-cloud.sh"
