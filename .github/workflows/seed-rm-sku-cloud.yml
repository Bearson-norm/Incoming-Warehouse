name: Seed RM SKU (cloud Postgres)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse CSV only (no DB writes)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: seed-rm-sku-cloud
  cancel-in-progress: false

jobs:
  seed:
    name: Replace RmCode on VPS
    runs-on: ubuntu-latest
    environment: cloud
    env:
      DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/incoming-warehouse' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync API seed files
        env:
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          set -euo pipefail
          REMOTE="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          SSH=(ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes)
          RSYNC=(rsync -az --exclude node_modules --exclude dist -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes")

          "${SSH[@]}" "$REMOTE" "mkdir -p '${DEPLOY_PATH}/Software/Dashboard/api/data' '${DEPLOY_PATH}/Software/Dashboard/api/scripts/lib' '${DEPLOY_PATH}/Software/infra/scripts/lib'"

          "${RSYNC[@]}" Software/Dashboard/api/data/rm-sku-inbound.csv "$REMOTE:${DEPLOY_PATH}/Software/Dashboard/api/data/"
          "${RSYNC[@]}" Software/Dashboard/api/scripts/replace-rm-codes-csv.ts "$REMOTE:${DEPLOY_PATH}/Software/Dashboard/api/scripts/"
          "${RSYNC[@]}" Software/Dashboard/api/scripts/lib/parse-rm-sku-csv.ts "$REMOTE:${DEPLOY_PATH}/Software/Dashboard/api/scripts/lib/"
          "${RSYNC[@]}" Software/Dashboard/api/tsconfig.scripts.json "$REMOTE:${DEPLOY_PATH}/Software/Dashboard/api/"
          "${RSYNC[@]}" Software/Dashboard/api/package.json "$REMOTE:${DEPLOY_PATH}/Software/Dashboard/api/"
          "${RSYNC[@]}" Software/infra/scripts/seed-rm-sku-mount.sh "$REMOTE:${DEPLOY_PATH}/Software/infra/scripts/"
          "${RSYNC[@]}" Software/infra/scripts/lib/docker-api-run.sh "$REMOTE:${DEPLOY_PATH}/Software/infra/scripts/lib/"

      - name: Run RM replace on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            INFRA="${{ env.DEPLOY_PATH }}/Software/infra"
            chmod +x "${INFRA}/scripts/seed-rm-sku-mount.sh"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              export DRY_RUN=1
            fi
            "${INFRA}/scripts/seed-rm-sku-mount.sh"

