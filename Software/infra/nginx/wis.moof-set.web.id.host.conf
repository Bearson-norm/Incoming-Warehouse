# Host nginx (systemd) — copy to /etc/nginx/sites-available/ and symlink sites-enabled.
# Proxies to Docker API bound on 127.0.0.1:4123 (default docker-compose.yml).
# Do NOT run the docker-nginx profile if host nginx already uses port 80.

server {
    listen 80;
    server_name wis.moof-set.web.id;

    # return 301 https://$server_name$request_uri;

    location /api {
        proxy_pass http://127.0.0.1:4123;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:4123;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location = / {
        default_type application/json;
        return 200 '{"service":"incoming-warehouse-cloud-api","health":"/api/health"}';
    }

    location / {
        return 404;
    }
}
