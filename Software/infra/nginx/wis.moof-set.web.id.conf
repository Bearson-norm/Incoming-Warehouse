# Docker Compose nginx profile ONLY — upstream "api" resolves inside the Docker network.
# For systemd nginx on the VPS (port 80), use wis.moof-set.web.id.host.conf → /etc/nginx/sites-available/
# See nginx/README.md and scripts/install-host-nginx.sh

upstream api_backend {
    server api:4123;
}

server {
    listen 80;
    server_name wis.moof-set.web.id;

    # Redirect HTTP to HTTPS (uncomment if SSL is configured)
    # return 301 https://$server_name$request_uri;

    location /api {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # VPS cloud: API-only (UI runs in Electron on each station)
    location = / {
        default_type application/json;
        return 200 '{"service":"incoming-warehouse-cloud-api","health":"/api/health"}';
    }

    location / {
        return 404;
    }
}

